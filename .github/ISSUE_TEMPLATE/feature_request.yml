name: 💡 Feature Request
description: Suggest a new feature or improvement for Aurora-Provider.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Aurora-Provider better? We'd love to hear it!
        Please fill out this form to propose your feature or enhancement.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem? Please describe.
      placeholder: E.g., I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: E.g., I would like Aurora-Provider to support...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: E.g., I tried to do this by using a proxy, but...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or code examples that might help explain your request.
      placeholder: E.g., Links to provider docs, diagrams, etc.
    validations:
      required: false

  - type: checkboxes
    id: validation
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't been proposed yet.
          required: true
