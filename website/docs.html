<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora-Provider Documentation</title>
  <meta name="description" content="Documentation portal for Aurora-Provider: fallback routing, key rotation, proxy masking, and setup.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Prism.js Dark Theme for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <style>
    /* ─── CSS Variables (Egyptian Night theme matching index.css) ─── */
    :root {
      --color-bg: #070a13;
      --color-sidebar: #0a0e1c;
      --color-card-border: rgba(255, 255, 255, 0.07);
      --color-primary: #14b8a6; /* Teal */
      --color-secondary: #a855f7; /* Purple */
      --color-accent: #06b6d4; /* Cyan */
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Outfit', var(--font-sans);
      --font-mono: 'Fira Code', monospace;
      
      --sidebar-width: 280px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Base Styles ─── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background Glows ─── */
    .aurora-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
      z-index: 1;
      pointer-events: none;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: var(--color-primary);
      top: -100px;
      right: -100px;
    }

    .glow-2 {
      width: 500px;
      height: 500px;
      background: var(--color-secondary);
      bottom: -150px;
      left: -150px;
    }

    /* ─── Sidebar Layout ─── */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--color-sidebar);
      border-right: 1px solid var(--color-card-border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      transition: var(--transition);
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--color-card-border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--color-text);
    }

    .logo-icon {
      font-size: 1.4rem;
    }

    .logo-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
    }

    .logo-text span {
      color: var(--color-primary);
    }

    .sidebar-nav {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      margin-bottom: 0.5rem;
      margin-top: 1rem;
    }

    .nav-title:first-child {
      margin-top: 0;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      color: var(--color-text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .nav-btn:hover {
      color: var(--color-text);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-btn.active {
      color: #070a13;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--color-card-border);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--color-primary);
    }

    /* ─── Main Content Layout ─── */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    /* Mobile Header */
    .mobile-header {
      display: none;
      height: 60px;
      background-color: var(--color-sidebar);
      border-bottom: 1px solid var(--color-card-border);
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 9;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      color: var(--color-text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
    }

    .content-area {
      flex: 1;
      padding: 3rem 4rem;
      max-width: 960px;
      width: 100%;
    }

    /* ─── Markdown Content Styles ─── */
    .md-content h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 30%, var(--color-text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .md-content h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--color-card-border);
      padding-bottom: 0.5rem;
    }

    .md-content h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .md-content p {
      margin-bottom: 1.25rem;
      color: rgba(241, 245, 249, 0.85);
      line-height: 1.7;
    }

    .md-content code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: var(--color-primary);
    }

    .md-content pre code {
      background-color: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
      font-size: 0.9em;
    }

    .md-content pre {
      background-color: rgba(13, 20, 38, 0.5) !important;
      border: 1px solid var(--color-card-border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      backdrop-filter: blur(8px);
    }

    .md-content ul, .md-content ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: rgba(241, 245, 249, 0.85);
    }

    .md-content li {
      margin-bottom: 0.5rem;
    }

    .md-content a {
      color: var(--color-primary);
      text-decoration: none;
      border-bottom: 1px dashed var(--color-primary);
      transition: var(--transition);
    }

    .md-content a:hover {
      color: var(--color-accent);
      border-bottom-style: solid;
    }

    /* Custom Tables styling */
    .md-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .md-content th, .md-content td {
      border: 1px solid var(--color-card-border);
      padding: 0.75rem 1rem;
      text-align: left;
    }

    .md-content th {
      background-color: rgba(255, 255, 255, 0.02);
      font-weight: 600;
    }

    .md-content tr:nth-child(even) td {
      background-color: rgba(255, 255, 255, 0.01);
    }

    /* ─── Alert Block Styles ─── */
    .alert-block {
      border-left: 4px solid #ccc;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border: 1px solid var(--color-card-border);
      border-left-width: 4px;
    }

    .alert-title {
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-content p:last-child {
      margin-bottom: 0;
    }

    /* Alert Types */
    .alert-note {
      border-left-color: var(--color-accent);
      background: rgba(6, 182, 212, 0.03);
    }
    .alert-note .alert-title { color: var(--color-accent); }

    .alert-tip {
      border-left-color: var(--color-primary);
      background: rgba(20, 184, 166, 0.03);
    }
    .alert-tip .alert-title { color: var(--color-primary); }

    .alert-important {
      border-left-color: var(--color-secondary);
      background: rgba(168, 85, 247, 0.03);
    }
    .alert-important .alert-title { color: var(--color-secondary); }

    .alert-warning {
      border-left-color: var(--color-warning);
      background: rgba(245, 158, 11, 0.03);
    }
    .alert-warning .alert-title { color: var(--color-warning); }

    .alert-caution {
      border-left-color: var(--color-danger);
      background: rgba(239, 68, 68, 0.03);
    }
    .alert-caution .alert-title { color: var(--color-danger); }

    /* ─── Responsive Adjustments ─── */
    @media (max-width: 1024px) {
      .content-area {
        padding: 2.5rem;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        transform: translateX(-100%);
        width: 100%;
        max-width: 280px;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-wrapper {
        margin-left: 0;
      }

      .mobile-header {
        display: flex;
      }

      .content-area {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Glows -->
  <div class="aurora-glow glow-1"></div>
  <div class="aurora-glow glow-2"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">Aurora<span>Provider</span></span>
      </a>
    </div>
    <div class="sidebar-nav">
      <div class="nav-title">Documentation</div>
      <button class="nav-btn active" data-tab="welcome">💡 Welcome</button>
      <button class="nav-btn" data-tab="architecture">🏗️ Architecture</button>
      <button class="nav-btn" data-tab="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-tab="api-reference">🔌 API Reference</button>
      <button class="nav-btn" data-tab="providers-guide">🔑 Providers Guide</button>
    </div>
    <div class="sidebar-footer">
      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Mobile Sticky Header -->
    <header class="mobile-header">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
      <a href="index.html" class="logo">
        <span class="logo-text">Aurora<span>Provider</span></span>
      </a>
      <div style="width: 24px;"></div> <!-- spacer -->
    </header>

    <!-- Main Content Reader -->
    <main class="content-area">
      <article class="md-content" id="doc-viewport">
        <!-- Rendered markdown goes here -->
      </article>
    </main>
  </div>

  <!-- Import Bundle Docs Data (window.AURORA_DOCS) -->
  <script src="docs-data.js"></script>
  
  <!-- Import Marked.js for parsing Markdown to HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Import Prism.js for code highlight -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const docViewport = document.getElementById('doc-viewport');
      const navBtns = document.querySelectorAll('.nav-btn');
      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menuToggle');

      // Setup Marked options (allow safe HTML/headings etc.)
      marked.setOptions({
        gfm: true,
        breaks: true,
        headerIds: true
      });

      // Post-process HTML to render GitHub Markdown Alerts beautifully
      function postProcessAlerts(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const blockquotes = doc.querySelectorAll('blockquote');
        
        blockquotes.forEach(bq => {
          const text = bq.textContent.trim();
          const match = text.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
          if (match) {
            const type = match[1].toLowerCase();
            // Remove the trigger text [!NOTE] from html
            const cleanHTML = bq.innerHTML
              .replace(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i, '')
              .trim();
            
            const alertDiv = doc.createElement('div');
            alertDiv.className = `alert-block alert-${type}`;
            
            let titleText = type.toUpperCase();
            let icon = 'ℹ️';
            if (type === 'tip') { icon = '💡'; }
            else if (type === 'important') { icon = '📢'; }
            else if (type === 'warning') { icon = '⚠️'; }
            else if (type === 'caution') { icon = '🔥'; }
            
            alertDiv.innerHTML = `
              <div class="alert-title">${icon} ${titleText}</div>
              <div class="alert-content">${cleanHTML}</div>
            `;
            
            bq.replaceWith(alertDiv);
          }
        });
        return doc.body.innerHTML;
      }

      // Load Document tab
      function loadDoc(docKey) {
        if (!window.AURORA_DOCS || !window.AURORA_DOCS[docKey]) {
          docViewport.innerHTML = '<h1>Error</h1><p>Documentation page not found.</p>';
          return;
        }

        const rawMarkdown = window.AURORA_DOCS[docKey];
        // Parse Markdown to HTML
        let html = marked.parse(rawMarkdown);
        // Process Alerts
        html = postProcessAlerts(html);
        
        docViewport.innerHTML = html;

        // Re-highlight Code blocks with Prism
        Prism.highlightAllUnder(docViewport);

        // Update URL hash without reload
        window.location.hash = docKey;
        
        // Scroll content to top
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      // Tab click events
      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          navBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const docKey = btn.getAttribute('data-tab');
          loadDoc(docKey);

          // Close mobile sidebar on selection
          sidebar.classList.remove('open');
        });
      });

      // Mobile Menu Toggle
      if (menuToggle) {
        menuToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          sidebar.classList.toggle('open');
        });
      }

      // Close mobile sidebar when clicking outside
      document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== menuToggle) {
          sidebar.classList.remove('open');
        }
      });

      // Handle internal markdown links gracefully without reloading or 404s
      docViewport.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link) {
          const href = link.getAttribute('href');
          if (href) {
            // Handle links back to the main repository README
            if (href.includes('README.md')) {
              e.preventDefault();
              window.location.href = 'https://github.com/ahmed-zhran/aurora-provider#readme';
              return;
            }
            
            // Handle links to other documentation pages (e.g. dashboard.md)
            if (href.includes('.md')) {
              e.preventDefault();
              // Split out any hash like dashboard.md#api-keys
              const [pathPart, hashPart] = href.split('#');
              const docKey = pathPart.replace('.md', '').replace('./', '');
              
              if (window.AURORA_DOCS && window.AURORA_DOCS[docKey]) {
                // Find corresponding nav button to trigger the same logic
                const targetBtn = Array.from(navBtns).find(b => b.getAttribute('data-tab') === docKey);
                
                if (targetBtn) {
                  targetBtn.click(); // Triggers the existing logic and changes URL hash
                  
                  // If there was a hash in the link, scroll to it after rendering
                  if (hashPart) {
                    setTimeout(() => {
                      const targetEl = document.getElementById(hashPart);
                      if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                      }
                    }, 50); // slight delay to allow markdown render to finish
                  }
                }
              }
            }
          }
        }
      });

      // Handle direct link load via hash or default
      const initialHash = window.location.hash.substring(1);
      if (initialHash && window.AURORA_DOCS[initialHash]) {
        navBtns.forEach(b => {
          if (b.getAttribute('data-tab') === initialHash) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
        loadDoc(initialHash);
      } else {
        loadDoc('welcome');
      }
    });
  </script>
</body>
</html>
